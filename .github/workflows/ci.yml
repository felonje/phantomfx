name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phantomfx
          POSTGRES_PASSWORD: phantomfx
          POSTGRES_DB: phantomfx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phantomfx" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://phantomfx:phantomfx@localhost:5432/phantomfx?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production
      ADMIN_EMAIL: admin@phantomfx.local
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run setup
      - run: npm run build
