# Local development: `docker compose up -d db`
# Full production-like stack: `docker compose --profile prod up --build`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phantomfx
      POSTGRES_PASSWORD: phantomfx
      POSTGRES_DB: phantomfx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantomfx"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [prod]
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://phantomfx:phantomfx@db:5432/phantomfx?schema=public
    depends_on:
      db: { condition: service_healthy }

  app:
    profiles: [prod]
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://phantomfx:phantomfx@db:5432/phantomfx?schema=public
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
